<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Spire Muses — deckbuilder roguelike. Juega gratis en cualquier dispositivo.">
<link rel="icon" href="assets/ui/karen_icon.png">
<link rel="apple-touch-icon" href="assets/ui/karen_icon.png">
<title>Spire Muses — La Torre de las Musas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">

<body>
<div id="viewport"><div id="stage">
  <div id="topbar" class="hidden">
    <div class="who" id="tb_who"></div>
    <div class="stat hp" id="tb_hp"></div>
    <div class="stat gold" id="tb_gold"></div>
    <div class="potions" id="tb_potions"></div>
    <div class="relics" id="tb_relics"></div>
    <div class="act-name" id="tb_act"></div>
    <button class="btn small" id="tb_deck" data-tipt="<b>Tu mazo</b>Mira todas tus cartas."></button>
    <button class="iconbtn" id="tb_menu" data-tipt="<b>Pausa</b>Guardar y salir, rendirse (Esc)">☰</button>
    <button class="iconbtn" id="tb_help" data-tipt="<b>Cómo jugar</b>">❓</button>
    <button class="iconbtn" id="tb_opt" data-tipt="<b>Opciones</b>Volumen y controles.">⚙️</button>
    <button class="iconbtn" id="tb_full" data-tipt="<b>Pantalla completa</b>">⛶</button>
  </div>
  <div id="title" class="screen"></div>
  <div id="select" class="screen hidden"></div>
  <div id="map" class="screen hidden"></div>
  <div id="combat" class="screen hidden"></div>
  <div id="reward" class="screen hidden"></div>
  <div id="shop" class="screen hidden"></div>
  <div id="rest" class="screen hidden"></div>
  <div id="event" class="screen hidden"></div>
  <div id="end" class="screen hidden"></div>
  <div id="gallery" class="screen hidden"></div>
  <div id="ending" class="screen hidden"></div>
  <div id="toast"></div>
</div></div>
<div id="rotate"><div>📱↻<p>Gira tu dispositivo en horizontal para jugar</p></div></div>
